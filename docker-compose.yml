services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bigdata-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bigdata-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - bigdata-net

  producer:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.producer
    container_name: kafka-producer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: loan-events
      MSG_PER_SECOND: 50
      DATA_FILE: /app/data/accepted_2007_to_2018q4.csv/accepted_2007_to_2018Q4.csv
    volumes:
      - ./data:/app/data
      - ./producer:/app/producer
    networks:
      - bigdata-net

  spark:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.spark
    container_name: spark
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: loan-events
      DELTA_BASE: /app/delta_lake
    volumes:
      - ./spark:/app/spark
      - ./notebooks:/app/notebooks
      - ./delta_lake:/app/delta_lake
      - ./mlruns:/app/mlruns
    ports:
      - "4040:4040"
      - "8888:8888"
    networks:
      - bigdata-net

  mlflow:
    image: python:3.11-slim
    container_name: mlflow
    command: >
      bash -c "pip install mlflow && mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /app/mlruns
      --default-artifact-root /app/mlartifacts"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlartifacts:/app/mlartifacts
    networks:
      - bigdata-net

networks:
  bigdata-net:
    driver: bridge
